name: Security Scan

on:
  push:
    branches: [marketplace-ebfaf249]
  pull_request:
    branches: [marketplace-ebfaf249]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: marketplace-sub2api-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify patched Go version
        run: go version | grep -q 'go1.26.6'

      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  frontend-security:
    name: Frontend security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run production dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high --json > audit.json || true

      - name: Check audited exceptions and expiry
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml

  image-exception-policy:
    name: Image exception policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Enforce SheetJS exception expiry
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          expiry=2026-10-06
          [[ "$today" < "$expiry" ]] || {
            echo "SheetJS image-scan exceptions expired on $expiry" >&2
            exit 1
          }
          grep -qx 'CVE-2023-30533' .trivyignore
          grep -qx 'GHSA-4r6h-8v6p-xvw6' .trivyignore
          grep -qx 'CVE-2024-22363' .trivyignore
          grep -qx 'GHSA-5pgg-2g8v-p4x9' .trivyignore
